<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修复FSA数据同步</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .container {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #00ff9f;
            border-bottom: 2px solid #00ff9f;
            padding-bottom: 10px;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: #333;
        }
        .success {
            background: #1a4d2e;
            color: #4ade80;
            border-left: 4px solid #4ade80;
        }
        .error {
            background: #4d1a1a;
            color: #f87171;
            border-left: 4px solid #f87171;
        }
        .info {
            background: #1a3d4d;
            color: #60a5fa;
            border-left: 4px solid #60a5fa;
        }
        .warning {
            background: #4d3d1a;
            color: #fbbf24;
            border-left: 4px solid #fbbf24;
        }
        button {
            background: #00ff9f;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
        }
        button:hover {
            background: #00cc7f;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            color: #999;
        }
        .data-preview {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .region-config {
            background: #333;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #00ff9f;
        }
        .fsa-input {
            width: 100%;
            min-height: 100px;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            margin: 10px 0;
        }
        .region-selector {
            margin: 20px 0;
        }
        select {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 修复FSA数据同步</h1>

        <div id="status"></div>

        <div class="button-group">
            <button onclick="analyzeLocalData()">🔍 分析本地数据</button>
            <button onclick="createDefaultRegions()">📦 创建默认8个区域</button>
            <button onclick="manualAssignFSA()">✏️ 手动分配FSA</button>
        </div>

        <div id="manualConfig" style="display:none;">
            <h2>手动分配FSA到区域</h2>
            <div class="region-selector">
                <label for="regionSelect">选择区域：</label>
                <select id="regionSelect">
                    <option value="1">区域 1</option>
                    <option value="2">区域 2</option>
                    <option value="3">区域 3</option>
                    <option value="4">区域 4</option>
                    <option value="5">区域 5</option>
                    <option value="6">区域 6</option>
                    <option value="7">区域 7</option>
                    <option value="8">区域 8</option>
                </select>
            </div>
            <div>
                <label>输入FSA代码（逗号或空格分隔）：</label>
                <textarea id="fsaInput" class="fsa-input" placeholder="例如: M5V, M5G, M4W 或 M5V M5G M4W"></textarea>
            </div>
            <button onclick="assignFSAToRegion()">分配到选定区域</button>
            <button onclick="saveToDatabase()">💾 保存到数据库</button>
        </div>

        <div id="dataPreview"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5050/api/v1';
        let regionConfigs = {};

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `${new Date().toLocaleTimeString()} - ${message}`;
            statusDiv.appendChild(div);
            statusDiv.scrollTop = statusDiv.scrollHeight;
        }

        function analyzeLocalData() {
            showStatus('分析本地存储数据...', 'info');

            const dataPreview = document.getElementById('dataPreview');
            dataPreview.innerHTML = '<h3>找到的数据：</h3>';

            // 查找所有可能包含FSA的键
            const allFSAs = new Set();
            const dataFound = {};

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes('region') || key.includes('fsa') || key.includes('postal') || key.includes('unified')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        dataFound[key] = data;

                        // 提取FSA代码
                        if (Array.isArray(data)) {
                            data.forEach(item => {
                                if (typeof item === 'string' && item.length >= 3) {
                                    allFSAs.add(item.substring(0, 3).toUpperCase());
                                }
                            });
                        } else if (typeof data === 'object') {
                            // 递归查找FSA
                            extractFSAs(data, allFSAs);
                        }
                    } catch (e) {
                        console.log(`无法解析 ${key}:`, e);
                    }
                }
            }

            showStatus(`找到 ${allFSAs.size} 个唯一FSA代码`, 'success');

            const div = document.createElement('div');
            div.className = 'data-preview';
            div.innerHTML = `
                <h4>所有FSA代码（${allFSAs.size}个）：</h4>
                <pre>${Array.from(allFSAs).join(', ')}</pre>
                <h4>原始数据：</h4>
                <pre>${JSON.stringify(dataFound, null, 2)}</pre>
            `;
            dataPreview.appendChild(div);

            // 保存FSA列表供后续使用
            window.allFSAs = Array.from(allFSAs);
        }

        function extractFSAs(obj, fsaSet) {
            if (Array.isArray(obj)) {
                obj.forEach(item => {
                    if (typeof item === 'string' && item.length >= 3) {
                        fsaSet.add(item.substring(0, 3).toUpperCase());
                    } else if (typeof item === 'object') {
                        extractFSAs(item, fsaSet);
                    }
                });
            } else if (typeof obj === 'object' && obj !== null) {
                for (const key in obj) {
                    const value = obj[key];
                    if (key === 'fsa' || key === 'fsaCodes' || key === 'postalCodes') {
                        if (Array.isArray(value)) {
                            value.forEach(item => {
                                if (typeof item === 'string' && item.length >= 3) {
                                    fsaSet.add(item.substring(0, 3).toUpperCase());
                                }
                            });
                        }
                    } else if (typeof value === 'object') {
                        extractFSAs(value, fsaSet);
                    }
                }
            }
        }

        function createDefaultRegions() {
            showStatus('创建默认8个区域...', 'info');

            // 初始化8个区域
            for (let i = 1; i <= 8; i++) {
                regionConfigs[i] = {
                    id: i.toString(),
                    name: `区域 ${i}`,
                    isActive: false,
                    postalCodes: [],
                    fsaCodes: [],
                    weightRanges: [
                        { min: 0, max: 10, label: '0-10 KGS', price: 15, isActive: true },
                        { min: 10.001, max: 20, label: '10.001-20 KGS', price: 25, isActive: true },
                        { min: 20.001, max: 30, label: '20.001-30 KGS', price: 35, isActive: true },
                        { min: 30.001, max: 40, label: '30.001-40 KGS', price: 45, isActive: true },
                        { min: 40.001, max: 50, label: '40.001-50 KGS', price: 55, isActive: true },
                        { min: 50.001, max: Infinity, label: '50+ KGS', price: 65, isActive: true }
                    ]
                };
            }

            showStatus('8个默认区域已创建', 'success');
            updatePreview();
        }

        function manualAssignFSA() {
            document.getElementById('manualConfig').style.display = 'block';

            // 如果还没有创建区域，先创建
            if (Object.keys(regionConfigs).length === 0) {
                createDefaultRegions();
            }

            // 如果有之前分析的FSA，预填充第一个区域
            if (window.allFSAs && window.allFSAs.length > 0) {
                document.getElementById('fsaInput').value = window.allFSAs.join(', ');
                showStatus(`已加载 ${window.allFSAs.length} 个FSA代码到输入框`, 'info');
            }
        }

        function assignFSAToRegion() {
            const regionId = document.getElementById('regionSelect').value;
            const fsaInput = document.getElementById('fsaInput').value;

            if (!fsaInput.trim()) {
                showStatus('请输入FSA代码', 'warning');
                return;
            }

            // 解析FSA代码
            const fsaCodes = fsaInput
                .split(/[,\s]+/)
                .map(code => code.trim().toUpperCase())
                .filter(code => code.length >= 3)
                .map(code => code.substring(0, 3));

            if (fsaCodes.length === 0) {
                showStatus('没有有效的FSA代码', 'error');
                return;
            }

            // 分配到区域
            if (!regionConfigs[regionId]) {
                regionConfigs[regionId] = {
                    id: regionId,
                    name: `区域 ${regionId}`,
                    isActive: true,
                    postalCodes: [],
                    fsaCodes: [],
                    weightRanges: []
                };
            }

            regionConfigs[regionId].fsaCodes = [...new Set(fsaCodes)];
            regionConfigs[regionId].postalCodes = fsaCodes;
            regionConfigs[regionId].isActive = true;

            showStatus(`已分配 ${fsaCodes.length} 个FSA到区域 ${regionId}`, 'success');

            // 清空输入框
            document.getElementById('fsaInput').value = '';

            updatePreview();
        }

        function updatePreview() {
            const dataPreview = document.getElementById('dataPreview');
            dataPreview.innerHTML = '<h3>当前区域配置：</h3>';

            for (const [regionId, config] of Object.entries(regionConfigs)) {
                const div = document.createElement('div');
                div.className = 'region-config';
                div.innerHTML = `
                    <strong>区域 ${regionId}: ${config.name}</strong><br>
                    状态: ${config.isActive ? '✅ 激活' : '❌ 未激活'}<br>
                    FSA数量: ${config.fsaCodes.length}<br>
                    FSA列表: ${config.fsaCodes.slice(0, 10).join(', ')}${config.fsaCodes.length > 10 ? '...' : ''}
                `;
                dataPreview.appendChild(div);
            }
        }

        async function saveToDatabase() {
            showStatus('开始保存到数据库...', 'info');

            let successCount = 0;
            let errorCount = 0;

            for (const [regionId, config] of Object.entries(regionConfigs)) {
                if (config.fsaCodes.length === 0) {
                    showStatus(`跳过空区域 ${regionId}`, 'warning');
                    continue;
                }

                try {
                    // 先尝试更新
                    let response = await fetch(`${API_BASE}/regions/${regionId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: config.name,
                            isActive: config.isActive,
                            postalCodes: config.fsaCodes,
                            weightRanges: config.weightRanges
                        })
                    });

                    if (response.status === 404) {
                        // 不存在则创建
                        response = await fetch(`${API_BASE}/regions`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                id: regionId,
                                name: config.name,
                                isActive: config.isActive,
                                postalCodes: config.fsaCodes,
                                weightRanges: config.weightRanges
                            })
                        });
                    }

                    if (response.ok) {
                        successCount++;
                        showStatus(`✅ 区域 ${regionId} 保存成功`, 'success');
                    } else {
                        errorCount++;
                        showStatus(`❌ 区域 ${regionId} 保存失败`, 'error');
                    }
                } catch (error) {
                    errorCount++;
                    showStatus(`❌ 区域 ${regionId} 错误: ${error.message}`, 'error');
                }
            }

            // 保存到localStorage
            localStorage.setItem('unified_region_data', JSON.stringify(regionConfigs));

            showStatus(`保存完成！成功: ${successCount}, 失败: ${errorCount}`,
                       errorCount === 0 ? 'success' : 'warning');
        }

        // 页面加载时自动分析
        window.onload = () => {
            analyzeLocalData();
        };
    </script>
</body>
</html>
