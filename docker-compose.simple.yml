version: '3.8'

services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}-frontend:latest
    container_name: map-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:latest
    container_name: map-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5050
    volumes:
      - ./data:/app/data
      - ./logs/backend:/app/logs