<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据迁移到后端数据库</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .status {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .status h3 {
            margin-top: 0;
        }
        button {
            background: linear-gradient(45deg, #2196F3 30%, #21CBF3 90%);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .success {
            color: #4CAF50;
            font-weight: bold;
        }
        .error {
            color: #f44336;
            font-weight: bold;
        }
        .warning {
            color: #FFC107;
        }
        .info {
            color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 数据迁移工具</h1>
        <p>将本地存储的配送区域数据迁移到后端数据库</p>
        
        <div class="status">
            <h3>当前状态</h3>
            <div id="statusInfo">
                <p>📍 后端服务: <span id="backendStatus">检查中...</span></p>
                <p>💾 本地数据: <span id="localDataStatus">检查中...</span></p>
                <p>🗄️ 数据库数据: <span id="dbDataStatus">检查中...</span></p>
            </div>
        </div>

        <button id="checkBtn" onclick="checkStatus()">🔍 检查状态</button>
        <button id="migrateBtn" onclick="migrateData()" disabled>🚀 开始迁移</button>
        <button id="verifyBtn" onclick="verifyData()" disabled>✅ 验证数据</button>
        <button id="clearLocalBtn" onclick="clearLocalData()" disabled>🗑️ 清理本地数据</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5050/api/v1';
        let localData = null;
        let dbData = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function checkStatus() {
            log('开始检查系统状态...', 'info');
            
            // 检查后端服务
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                if (data.success) {
                    document.getElementById('backendStatus').innerHTML = '<span class="success">✅ 在线</span>';
                    log('后端服务正常', 'success');
                }
            } catch (error) {
                document.getElementById('backendStatus').innerHTML = '<span class="error">❌ 离线</span>';
                log('后端服务不可用: ' + error.message, 'error');
                return;
            }

            // 检查本地数据
            try {
                const storedData = localStorage.getItem('unified_region_data');
                if (storedData) {
                    localData = JSON.parse(storedData);
                    const regionCount = Object.keys(localData).length;
                    let totalPostalCodes = 0;
                    Object.values(localData).forEach(region => {
                        if (region.postalCodes) {
                            totalPostalCodes += region.postalCodes.length;
                        }
                    });
                    document.getElementById('localDataStatus').innerHTML = 
                        `<span class="success">✅ ${regionCount} 个区域, ${totalPostalCodes} 个邮编</span>`;
                    log(`本地数据: ${regionCount} 个区域, ${totalPostalCodes} 个邮编`, 'success');
                } else {
                    document.getElementById('localDataStatus').innerHTML = 
                        '<span class="warning">⚠️ 无数据</span>';
                    log('本地无数据', 'warning');
                }
            } catch (error) {
                document.getElementById('localDataStatus').innerHTML = 
                    '<span class="error">❌ 读取失败</span>';
                log('读取本地数据失败: ' + error.message, 'error');
            }

            // 检查数据库数据
            try {
                const response = await fetch(`${API_BASE}/regions`);
                const data = await response.json();
                if (data.success) {
                    dbData = data.data;
                    const regionCount = dbData.length;
                    let totalPostalCodes = 0;
                    dbData.forEach(region => {
                        if (region.postalCodes) {
                            totalPostalCodes += region.postalCodes.length;
                        }
                    });
                    document.getElementById('dbDataStatus').innerHTML = 
                        `<span class="info">📊 ${regionCount} 个区域, ${totalPostalCodes} 个邮编</span>`;
                    log(`数据库数据: ${regionCount} 个区域, ${totalPostalCodes} 个邮编`, 'info');
                }
            } catch (error) {
                document.getElementById('dbDataStatus').innerHTML = 
                    '<span class="error">❌ 连接失败</span>';
                log('连接数据库失败: ' + error.message, 'error');
            }

            // 启用按钮
            if (localData && Object.keys(localData).length > 0) {
                document.getElementById('migrateBtn').disabled = false;
            }
            if (dbData && dbData.length > 0) {
                document.getElementById('verifyBtn').disabled = false;
            }
            document.getElementById('clearLocalBtn').disabled = false;
        }

        async function migrateData() {
            if (!localData) {
                log('没有可迁移的本地数据', 'error');
                return;
            }

            log('开始迁移数据到数据库...', 'info');
            document.getElementById('migrateBtn').disabled = true;

            let successCount = 0;
            let errorCount = 0;

            for (const [regionId, regionData] of Object.entries(localData)) {
                try {
                    log(`迁移区域 ${regionId}...`, 'info');
                    
                    // 准备数据
                    const payload = {
                        id: regionId,
                        name: regionData.name || `区域${regionId}`,
                        isActive: regionData.isActive || false,
                        postalCodes: regionData.postalCodes || [],
                        weightRanges: regionData.weightRanges || [],
                        prices: regionData.prices || {}
                    };

                    // 发送到后端
                    const response = await fetch(`${API_BASE}/regions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        successCount++;
                        log(`✅ 区域 ${regionId} 创建成功`, 'success');
                    } else if (response.status === 409) {
                        // 区域已存在，直接更新
                        log(`区域 ${regionId} 已存在，更新数据...`, 'info');
                        const updateResponse = await fetch(`${API_BASE}/regions/${regionId}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                        
                        if (updateResponse.ok) {
                            successCount++;
                            log(`✅ 区域 ${regionId} 更新成功`, 'success');
                        } else {
                            errorCount++;
                            const errorText = await updateResponse.text();
                            log(`❌ 区域 ${regionId} 更新失败: ${errorText}`, 'error');
                        }
                    } else {
                        errorCount++;
                        const errorText = await response.text();
                        log(`❌ 区域 ${regionId} 创建失败: ${errorText}`, 'error');
                    }
                } catch (error) {
                    errorCount++;
                    log(`❌ 区域 ${regionId} 迁移出错: ${error.message}`, 'error');
                }
            }

            log(`迁移完成: ${successCount} 成功, ${errorCount} 失败`, 
                errorCount > 0 ? 'warning' : 'success');
            
            document.getElementById('migrateBtn').disabled = false;
            document.getElementById('verifyBtn').disabled = false;
            
            // 重新检查状态
            await checkStatus();
        }

        async function verifyData() {
            log('开始验证数据一致性...', 'info');
            
            try {
                // 获取最新数据库数据
                const response = await fetch(`${API_BASE}/regions`);
                const data = await response.json();
                
                if (!data.success) {
                    log('获取数据库数据失败', 'error');
                    return;
                }

                const dbRegions = data.data;
                const localRegions = localData || {};
                
                // 比较数据
                let consistent = true;
                
                for (const dbRegion of dbRegions) {
                    const localRegion = localRegions[dbRegion.id];
                    if (!localRegion) {
                        log(`⚠️ 区域 ${dbRegion.id} 只存在于数据库`, 'warning');
                        consistent = false;
                        continue;
                    }
                    
                    // 比较邮编数量
                    const dbPostalCount = dbRegion.postalCodes ? dbRegion.postalCodes.length : 0;
                    const localPostalCount = localRegion.postalCodes ? localRegion.postalCodes.length : 0;
                    
                    if (dbPostalCount !== localPostalCount) {
                        log(`⚠️ 区域 ${dbRegion.id} 邮编数量不一致: 数据库 ${dbPostalCount}, 本地 ${localPostalCount}`, 'warning');
                        consistent = false;
                    }
                }
                
                // 检查本地有但数据库没有的
                for (const localId of Object.keys(localRegions)) {
                    if (!dbRegions.find(r => r.id === localId)) {
                        log(`⚠️ 区域 ${localId} 只存在于本地`, 'warning');
                        consistent = false;
                    }
                }
                
                if (consistent) {
                    log('✅ 数据完全一致！', 'success');
                } else {
                    log('⚠️ 数据存在差异，建议重新迁移', 'warning');
                }
                
            } catch (error) {
                log('验证失败: ' + error.message, 'error');
            }
        }

        function clearLocalData() {
            if (confirm('确定要清理本地数据吗？建议先确认数据已成功迁移到数据库。')) {
                try {
                    // 清理所有相关的localStorage键
                    const keysToRemove = [
                        'unified_region_data',
                        'fsa_region_assignments',
                        'region_price_configs'
                    ];
                    
                    keysToRemove.forEach(key => {
                        localStorage.removeItem(key);
                        log(`已删除: ${key}`, 'info');
                    });
                    
                    localData = null;
                    log('✅ 本地数据已清理', 'success');
                    
                    // 重新检查状态
                    checkStatus();
                } catch (error) {
                    log('清理失败: ' + error.message, 'error');
                }
            }
        }

        // 页面加载时自动检查状态
        window.addEventListener('load', () => {
            checkStatus();
        });
    </script>
</body>
</html>
