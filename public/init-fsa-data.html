<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始化 FSA 数据</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 {
            color: #4fc3f7;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 1px solid #333;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px 10px 0;
            background: #4fc3f7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            background: #29b6f6;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #output {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
            min-height: 200px;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .success {
            color: #4caf50;
            font-weight: bold;
        }
        .error {
            color: #f44336;
            font-weight: bold;
        }
        .info {
            color: #2196f3;
        }
        .warning {
            color: #ff9800;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .stat-label {
            color: #999;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #4fc3f7;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🚀 初始化 FSA 数据到 Supabase</h1>
    
    <div class="controls">
        <h3>快速操作</h3>
        <button onclick="initializeAllRegions()">初始化所有区域 FSA</button>
        <button onclick="checkCurrentData()">检查当前数据</button>
        <button onclick="clearOutput()">清空输出</button>
    </div>

    <div class="controls">
        <h3>单个区域操作</h3>
        <button onclick="initializeRegion('1')">初始化 1区 (多伦多)</button>
        <button onclick="initializeRegion('2')">初始化 2区 (温哥华)</button>
        <button onclick="initializeRegion('3')">初始化 3区 (蒙特利尔)</button>
        <button onclick="initializeRegion('4')">初始化 4区 (卡尔加里)</button>
        <button onclick="initializeRegion('5')">初始化 5区 (埃德蒙顿)</button>
        <button onclick="initializeRegion('6')">初始化 6区 (渥太华)</button>
        <button onclick="initializeRegion('7')">初始化 7区 (温尼伯)</button>
        <button onclick="initializeRegion('8')">初始化 8区 (哈利法克斯)</button>
    </div>

    <div class="stats" id="stats"></div>

    <div id="output"></div>

    <script type="module">
        import { initializeAllRegionsFSA, initializeRegionFSA } from '/src/utils/initializeSupabaseData.js';
        import { getAllRegionConfigs } from '/src/utils/unifiedStorage.js';
        
        const output = document.getElementById('output');
        const stats = document.getElementById('stats');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }
        
        async function updateStats() {
            try {
                const regions = await getAllRegionConfigs();
                let totalFSAs = 0;
                let activeRegions = 0;
                
                Object.values(regions).forEach(region => {
                    const fsas = region.fsaCodes || region.fsa_codes || [];
                    totalFSAs += fsas.length;
                    if (region.isActive || region.is_active) activeRegions++;
                });
                
                stats.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">总区域数</div>
                        <div class="stat-value">${Object.keys(regions).length}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">活跃区域</div>
                        <div class="stat-value">${activeRegions}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">总 FSA 数量</div>
                        <div class="stat-value">${totalFSAs}</div>
                    </div>
                `;
            } catch (error) {
                console.error('更新统计失败:', error);
            }
        }
        
        window.initializeAllRegions = async function() {
            log('开始初始化所有区域 FSA 数据...', 'info');
            try {
                const results = await initializeAllRegionsFSA();
                log(`初始化完成！成功: ${results.success.length} 个区域, 失败: ${results.failed.length} 个区域`, 'success');
                if (results.failed.length > 0) {
                    log(`失败的区域: ${results.failed.join(', ')}`, 'error');
                }
                await updateStats();
            } catch (error) {
                log(`初始化失败: ${error.message}`, 'error');
            }
        };
        
        window.initializeRegion = async function(regionId) {
            log(`开始初始化区域 ${regionId} FSA 数据...`, 'info');
            try {
                const success = await initializeRegionFSA(regionId);
                if (success) {
                    log(`区域 ${regionId} 初始化成功！`, 'success');
                } else {
                    log(`区域 ${regionId} 初始化失败`, 'error');
                }
                await updateStats();
            } catch (error) {
                log(`区域 ${regionId} 初始化失败: ${error.message}`, 'error');
            }
        };
        
        window.checkCurrentData = async function() {
            log('检查当前数据...', 'info');
            try {
                const regions = await getAllRegionConfigs();
                log(`找到 ${Object.keys(regions).length} 个区域:`, 'info');
                
                Object.entries(regions).forEach(([id, region]) => {
                    const fsas = region.fsaCodes || region.fsa_codes || [];
                    const name = region.name || `区域 ${id}`;
                    const active = region.isActive || region.is_active ? '✅ 活跃' : '❌ 未激活';
                    log(`  ${id}: ${name} - ${fsas.length} 个FSA - ${active}`, 'info');
                });
                
                await updateStats();
            } catch (error) {
                log(`检查数据失败: ${error.message}`, 'error');
            }
        };
        
        window.clearOutput = function() {
            output.innerHTML = '';
            log('输出已清空', 'info');
        };
        
        // 页面加载时自动检查数据
        window.addEventListener('load', async () => {
            await checkCurrentData();
        });
    </script>
</body>
</html>
